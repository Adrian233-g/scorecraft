<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, title)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">ScoreCraft - Estadísticas Deportivas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        surface: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#0b0f19',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-surface-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-surface-900/90 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Brand -->
                <div class="flex items-center gap-3">
                    <a th:href="@{/}" class="flex items-center gap-2.5 group">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-brand-500/20 group-hover:scale-105 transition-transform duration-200">
                            <span class="text-xl">⚽</span>
                        </div>
                        <div>
                            <span class="text-xl font-extrabold tracking-tight text-white flex items-center gap-1.5">
                                Score<span class="text-emerald-400">Craft</span>
                            </span>
                            <span class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400">Versión Monolito en Capas</span>
                        </div>
                    </a>
                </div>

                <!-- Navigation Links -->
                <nav class="hidden md:flex items-center gap-1">
                    <a th:href="@{/dashboard}"
                       th:classappend="${activeTab == 'dashboard'} ? 'bg-slate-800 text-white shadow-sm ring-1 ring-slate-700' : 'text-slate-300 hover:text-white hover:bg-slate-800/50'"
                       class="px-3.5 py-2 rounded-lg text-sm font-semibold transition-all">
                        📊 Dashboard
                    </a>
                    <a th:href="@{/standings}"
                       th:classappend="${activeTab == 'standings'} ? 'bg-slate-800 text-white shadow-sm ring-1 ring-slate-700' : 'text-slate-300 hover:text-white hover:bg-slate-800/50'"
                       class="px-3.5 py-2 rounded-lg text-sm font-semibold transition-all">
                        🏆 Tabla de Posiciones
                    </a>
                    <a th:href="@{/matches}"
                       th:classappend="${activeTab == 'matches'} ? 'bg-slate-800 text-white shadow-sm ring-1 ring-slate-700' : 'text-slate-300 hover:text-white hover:bg-slate-800/50'"
                       class="px-3.5 py-2 rounded-lg text-sm font-semibold transition-all">
                        ⚔️ Encuentros
                    </a>
                    <a th:href="@{/teams}"
                       th:classappend="${activeTab == 'teams'} ? 'bg-slate-800 text-white shadow-sm ring-1 ring-slate-700' : 'text-slate-300 hover:text-white hover:bg-slate-800/50'"
                       class="px-3.5 py-2 rounded-lg text-sm font-semibold transition-all">
                        🛡️ Equipos
                    </a>
                </nav>

                <!-- Quick Actions -->
                <div class="flex items-center gap-2.5">
                    <a th:href="@{/matches/new}" class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider bg-brand-600 hover:bg-brand-500 text-white shadow-md shadow-brand-600/30 transition-all hover:scale-[1.02] active:scale-95">
                        <span>+ Programar Partido</span>
                    </a>
                    <a th:href="@{/teams/new}" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 transition-all hover:scale-[1.02] active:scale-95">
                        <span>+ Nuevo Equipo</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Global Toast / Alerts -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full">
        <div th:if="${successMessage}" class="mb-4 p-4 rounded-xl bg-emerald-950/80 border border-emerald-500/30 text-emerald-200 flex items-center justify-between backdrop-blur-sm shadow-lg shadow-emerald-950/40">
            <div class="flex items-center gap-3">
                <span class="text-xl">✅</span>
                <span class="text-sm font-medium" th:text="${successMessage}">Operación exitosa</span>
            </div>
            <button onclick="this.parentElement.remove()" class="text-emerald-400 hover:text-white text-xs font-bold uppercase tracking-wider px-2 py-1 rounded">Cerrar</button>
        </div>

        <div th:if="${errorMessage}" class="mb-4 p-4 rounded-xl bg-rose-950/80 border border-rose-500/30 text-rose-200 flex items-center justify-between backdrop-blur-sm shadow-lg shadow-rose-950/40">
            <div class="flex items-center gap-3">
                <span class="text-xl">⚠️</span>
                <span class="text-sm font-medium" th:text="${errorMessage}">Ha ocurrido un error</span>
            </div>
            <button onclick="this.parentElement.remove()" class="text-rose-400 hover:text-white text-xs font-bold uppercase tracking-wider px-2 py-1 rounded">Cerrar</button>
        </div>
    </div>

    <!-- Main Content Injection Point -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-surface-900 border-t border-slate-800 py-6 text-center text-xs text-slate-400">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div>
                <span class="font-bold text-slate-200">ScoreCraft</span> &copy; 2026 - Proyecto Integrador de Microservicios (Ciclo VIII).
            </div>
            <div class="flex items-center gap-4 text-slate-400">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 font-mono text-[11px]">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> SQL Server 2022 Activo
                </span>
                <span class="text-slate-500">|</span>
                <span>Fase 1: Capas</span>
            </div>
        </div>
    </footer>

</body>
</html>
