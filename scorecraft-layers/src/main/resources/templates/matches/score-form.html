<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::main-content}, ~{::title})}">
<head>
    <title>Registrar Marcador - ScoreCraft</title>
</head>
<body>
<div th:fragment="main-content" class="max-w-xl mx-auto space-y-6">

    <!-- Header Section -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
                <span>⚽</span> Registrar Marcador
            </h1>
            <p class="text-xs text-slate-400 mt-1" th:text="'Jornada ' + ${match.matchDay} + ' • ' + ${#temporals.format(match.matchDate, 'dd/MM/yyyy HH:mm')}">
                Jornada 1
            </p>
        </div>
        <a th:href="@{/matches}" class="text-xs font-semibold text-slate-400 hover:text-white bg-slate-800 px-3 py-2 rounded-xl transition-all">
            &larr; Volver
        </a>
    </div>

    <!-- Match Result Card -->
    <div class="bg-surface-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
        <form th:action="@{/matches/{id}/result/save(id=${match.id})}" th:object="${scoreDto}" method="post" class="space-y-6">

            <!-- Face-off Score Inputs -->
            <div class="grid grid-cols-5 items-center gap-3">
                <!-- Home Team Column -->
                <div class="col-span-2 flex flex-col items-center text-center space-y-2">
                    <div class="w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 p-2 flex items-center justify-center shadow-lg">
                        <img th:if="${match.homeTeam.logoUrl}" th:src="${match.homeTeam.logoUrl}" alt="Logo" class="max-w-full max-h-full object-contain" onerror="this.style.display='none'"/>
                        <span th:unless="${match.homeTeam.logoUrl}" class="font-mono font-bold text-slate-400" th:text="${match.homeTeam.shortName}">LOC</span>
                    </div>
                    <span class="font-extrabold text-white text-sm" th:text="${match.homeTeam.name}">Local</span>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">Local</span>

                    <!-- Home Score Input -->
                    <div class="w-24 mt-2">
                        <input type="number" min="0" max="99" th:field="*{homeScore}"
                               class="w-full text-center py-3 text-3xl font-mono font-black rounded-xl bg-slate-950 border-2 border-slate-700 text-white focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 shadow-inner"/>
                        <p th:if="${#fields.hasErrors('homeScore')}" th:errors="*{homeScore}" class="text-[10px] text-rose-400 mt-1"></p>
                    </div>
                </div>

                <!-- Separator Column -->
                <div class="col-span-1 flex flex-col items-center justify-center">
                    <span class="text-2xl font-black text-slate-600 font-mono">:</span>
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">VS</span>
                </div>

                <!-- Away Team Column -->
                <div class="col-span-2 flex flex-col items-center text-center space-y-2">
                    <div class="w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 p-2 flex items-center justify-center shadow-lg">
                        <img th:if="${match.awayTeam.logoUrl}" th:src="${match.awayTeam.logoUrl}" alt="Logo" class="max-w-full max-h-full object-contain" onerror="this.style.display='none'"/>
                        <span th:unless="${match.awayTeam.logoUrl}" class="font-mono font-bold text-slate-400" th:text="${match.awayTeam.shortName}">VIS</span>
                    </div>
                    <span class="font-extrabold text-white text-sm" th:text="${match.awayTeam.name}">Visitante</span>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-sky-400">Visitante</span>

                    <!-- Away Score Input -->
                    <div class="w-24 mt-2">
                        <input type="number" min="0" max="99" th:field="*{awayScore}"
                               class="w-full text-center py-3 text-3xl font-mono font-black rounded-xl bg-slate-950 border-2 border-slate-700 text-white focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 shadow-inner"/>
                        <p th:if="${#fields.hasErrors('awayScore')}" th:errors="*{awayScore}" class="text-[10px] text-rose-400 mt-1"></p>
                    </div>
                </div>
            </div>

            <!-- Status Dropdown -->
            <div class="pt-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Estado del Encuentro</label>
                <select th:field="*{status}"
                        class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm">
                    <option th:each="st : ${T(com.scorecraft.layers.domain.MatchStatus).values()}"
                            th:value="${st}"
                            th:text="${st.displayName}">Finalizado</option>
                </select>
            </div>

            <!-- Hint Callout -->
            <div class="p-3.5 rounded-xl bg-slate-950/60 border border-slate-800 text-xs text-slate-400 flex items-start gap-2.5">
                <span class="text-base">💡</span>
                <span>Al marcar como <strong>FINALIZADO</strong>, la tabla de posiciones se recalculará automáticamente otorgando 3 puntos al ganador o 1 punto por empate.</span>
            </div>

            <!-- Action buttons -->
            <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
                <a th:href="@{/matches}" class="px-5 py-2.5 rounded-xl text-xs font-bold uppercase text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 transition-all">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/30 transition-all hover:scale-[1.02] active:scale-95">
                    Guardar & Actualizar Tabla
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
