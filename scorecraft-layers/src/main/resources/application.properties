spring.application.name=scorecraft-layers

# Database Configuration (SQL Server Docker)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ScoreCraftLayers;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=SmartFill2024!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Server Port
server.port=8080
